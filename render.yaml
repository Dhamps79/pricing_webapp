services:
  - type: web
    name: live-spreadsheet
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: Live Spreadsheet
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      # By default, uses SQLite. To connect to Render PostgreSQL, uncomment and set:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: live-spreadsheet-db
      #     property: connectionString

