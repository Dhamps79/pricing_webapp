[project]
name = "pricing-webapp"
version = "0.1.0"
description = "Live Spreadsheet - Real-Time Pricing & Catalog Management Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0",
    "pdfplumber>=0.11.0",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

